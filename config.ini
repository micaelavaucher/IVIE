[Options]
enablerag = true
debug = true

[Size_World]
locations = 3-4
objects = 3-4
npcs = 2-3
puzzles = 2

[Models]
narrativemodel = gemini-2.5-flash
reasoningmodel = gemini-2.5-flash
; Gemini flash models think before answering by default, which multiplies latency.
; 0 turns thinking off; leave it empty to use the model's default.
thinkingbudget = 0

[Generation]
; Step 3 as four facet calls merged by a reconciler (false = original single call)
facets = true
; Step 4 returns only puzzles and blocked passages (false = original whole-world rewrite)
puzzlestageonly = true
; Run independent LLM calls at the same time: facets and starting narration (false = one after another)
parallel = true

[Game]
; Each turn: the reasoning model interprets the action, the engine applies what the rules allow, and the
; narration is written from what actually happened (false = one model call decides and narrates)
narratefromoutcome = true
; Each narration is checked against the world (what the player received, holds, was offered...) and
; rewritten once if it contradicts it. Adds about one second per turn
checknarration = true

[Database]
DatabaseName = payador_worlds
TracesCollection = world_traces